name: Deploy Logic Knowledge Base to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge base
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://maaoding.github.io/logic-knowledge-base/
          NEXT_PUBLIC_PRACTICE_SITE_URL: https://maaoding.github.io/logic-knowledge-base/practice/

      - name: Build practice site
        run: npm run build:practice
        env:
          GITHUB_PAGES: "true"
          VITE_KNOWLEDGE_BASE_URL: https://maaoding.github.io/logic-knowledge-base/

      - name: Prepare Pages artifact
        run: npm run prepare:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
