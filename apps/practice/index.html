    <script>
      (() => {
        const saved = localStorage.getItem("logicPractice.theme");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
